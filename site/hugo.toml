# 사이트 기본 설정. baseURL·theme은 배포 스크립트가 pages.json으로 넣으므로 여기서 지정하지 않는다.
title = "안진성"
locale = "ko-KR"
defaultContentLanguage = "ko"

# 홈 화면: 이름·소개를 보여 주는 PaperMod Profile 모드
[params.profileMode]
  enabled = true
  title = "안진성"
  subtitle = "전북대학교 컴퓨터공학부 안진성입니다"
  # assets/images/에 두면 테마가 150x150으로 줄여서 내보낸다. imageTitle은 img의 alt가 된다.
  imageUrl = "images/avatar.png"
  imageTitle = "노트북 뒤에서 화면을 보고 있는 안진성 미모티콘 아바타"
  imageWidth = 150
  imageHeight = 150

  # 홈 버튼. url 앞에 /를 붙이면 /portfolio/ 하위 경로가 빠지므로 상대 경로로 쓴다.
  [[params.profileMode.buttons]]
    name = "소개"
    url = "about/"

  [[params.profileMode.buttons]]
    name = "활동"
    url = "projects/"

# 홈 소셜 아이콘. name은 테마 아이콘 이름(소문자), title은 링크의 이름표가 된다.
[[params.socialIcons]]
  name = "github"
  title = "GitHub"
  url = "https://github.com/anjinsung-debug"

# 상단 메뉴(상대 경로)
[[menu.main]]
  name = "소개"
  url = "about/"
  weight = 1

[[menu.main]]
  name = "활동"
  url = "projects/"
  weight = 2
